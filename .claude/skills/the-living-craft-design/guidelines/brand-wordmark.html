<!-- @dsCard group="Brand" viewport="700x260" name="Wordmark" subtitle="No mark was supplied. The wordmark is the display face at 800, and that is the whole identity" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:0;background:var(--surface-sunken)}.lb{font-family:var(--font-mono);font-size:11px;color:var(--text-quiet);line-height:1.4}.wm{font-family:var(--font-display);font-weight:var(--weight-heavy);letter-spacing:-0.03em;line-height:0.98}</style></head>
<body><div style="display:grid;grid-template-columns:1fr 1fr;height:260px">
<div style="background:var(--noir);display:flex;flex-direction:column;justify-content:center;padding:var(--space-6)"><div class="wm" style="font-size:44px;color:#fff">The Living<br>Craft</div><div class="lb" style="margin-top:var(--space-4);color:rgba(255,255,255,0.45)">on noir \u00b7 the primary lockup</div></div>
<div style="background:var(--surface-panel);display:flex;flex-direction:column;justify-content:center;padding:var(--space-6);gap:var(--space-5)">
<div><div class="wm" style="font-size:28px;color:var(--text-loud)">The Living Craft</div><div class="lb" style="margin-top:6px">on white \u00b7 one line above 24px</div></div>
<div style="display:flex;align-items:center;gap:var(--space-3)"><span class="wm" style="font-size:15px;color:var(--text-loud)">The Living Craft</span><span style="height:22px;padding:0 10px;border-radius:var(--radius-pill);background:var(--sun);color:var(--ink-1);font-size:11px;font-weight:var(--weight-strong);display:inline-flex;align-items:center">Cohort 04</span></div>
<div class="lb">Never in caps, never letterspaced, never on ember or sun \u2014 the wordmark sits on noir or on white and nowhere else.</div>
</div>
</div>
</body></html>
