<!-- @dsCard group="Colors" viewport="700x150" name="Semantic aliases" subtitle="What components actually read — never base values" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 18px}.lb{font-family:var(--font-mono);font-size:11px;line-height:1.35;color:var(--text-quiet);letter-spacing:0}.vl{font-family:var(--font-mono);font-size:11px;color:var(--text-quiet)}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px"><div><div style="height:52px;background:var(--surface-page);border:1px solid var(--border-rule)"></div><div class="lb">page</div><div class="vl">surface-page</div></div><div><div style="height:52px;background:var(--surface-panel);border:1px solid var(--border-rule)"></div><div class="lb">panel</div><div class="vl">surface-panel</div></div><div><div style="height:52px;background:var(--surface-sunken);border:1px solid var(--border-rule)"></div><div class="lb">sunken</div><div class="vl">surface-sunken</div></div><div><div style="height:52px;background:var(--border-hair);border:1px solid var(--border-rule)"></div><div class="lb">hairline</div><div class="vl">border-hair</div></div><div><div style="height:52px;background:var(--border-rule);border:1px solid var(--border-rule)"></div><div class="lb">rule</div><div class="vl">border-rule</div></div><div><div style="height:52px;background:var(--text-body);border:1px solid var(--border-rule)"></div><div class="lb">body</div><div class="vl">text-body</div></div><div><div style="height:52px;background:var(--text-quiet);border:1px solid var(--border-rule)"></div><div class="lb">quiet</div><div class="vl">text-quiet</div></div><div><div style="height:52px;background:var(--text-faint);border:1px solid var(--border-rule)"></div><div class="lb">faint</div><div class="vl">text-faint</div></div></div></body></html>
