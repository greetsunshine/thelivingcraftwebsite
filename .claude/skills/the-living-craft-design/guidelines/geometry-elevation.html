<!-- @dsCard group="Geometry" viewport="700x220" name="Elevation" subtitle="Wide, near-colourless shadow. Never a border and a shadow on the same element" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:22px 20px;background:var(--surface-sunken)}.lb{font-family:var(--font-mono);font-size:11px;color:var(--text-quiet);line-height:1.4}.bx{height:96px;background:var(--surface-panel);border-radius:var(--radius-panel);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--text-quiet)}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-5)">
<div><div class="bx" style="box-shadow:none;border:var(--border-w-hair) solid var(--border-hair)">flat</div><div class="lb" style="margin-top:8px">hairline only — used inside an already-raised card</div></div>
<div><div class="bx" style="box-shadow:var(--shadow-raise)">raise</div><div class="lb" style="margin-top:8px">--shadow-raise · resting cards on mist</div></div>
<div><div class="bx" style="box-shadow:var(--shadow-lift)">lift</div><div class="lb" style="margin-top:8px">--shadow-lift · hover, dragged, selected</div></div>
<div><div class="bx" style="box-shadow:var(--shadow-overlay)">overlay</div><div class="lb" style="margin-top:8px">--shadow-overlay · dialogs, menus, the shell</div></div>
</div>
</body></html>
