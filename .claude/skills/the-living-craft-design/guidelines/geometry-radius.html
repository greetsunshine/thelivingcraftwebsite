<!-- @dsCard group="Geometry" viewport="700x210" name="Radius" subtitle="Nothing is square except the page. Five steps, each with one job" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;background:var(--surface-sunken)}.lb{font-family:var(--font-mono);font-size:11px;color:var(--text-quiet)}.bx{height:88px;background:var(--surface-panel);box-shadow:var(--shadow-raise)}.vl{font-family:var(--font-mono);font-size:11px;color:var(--text-body);margin-top:6px}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-4)">
<div><div class="bx" style="border-radius:var(--radius-inner)"></div><div class="vl">16px</div><div class="lb">inner · chips, swatches, media inside a card</div></div>
<div><div class="bx" style="border-radius:var(--radius-panel)"></div><div class="vl">24px</div><div class="lb">panel · list rows, form panels</div></div>
<div><div class="bx" style="border-radius:var(--radius-card)"></div><div class="vl">28px</div><div class="lb">card · hero and feature cards</div></div>
<div><div class="bx" style="border-radius:var(--radius-shell)"></div><div class="vl">40px</div><div class="lb">shell · the app frame itself</div></div>
<div><div class="bx" style="border-radius:var(--radius-pill);height:44px;margin-top:44px"></div><div class="vl">999px</div><div class="lb">pill · every button, every avatar</div></div>
</div>
</body></html>
