<!-- @dsCard group="Spacing" viewport="700x200" name="Scale" subtitle="4px base, nine steps. Card padding is 24px; sections breathe at 48–72px" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px}.lb{font-family:var(--font-mono);font-size:11px;color:var(--text-quiet)}.bar{background:var(--sun);border-radius:4px}</style></head>
<body><div style="display:grid;gap:var(--space-5)">
<div style="display:flex;gap:14px;align-items:flex-end">
<div style="text-align:center"><div class="bar" style="width:4px;height:20px"></div><div class="lb">4</div></div>
<div style="text-align:center"><div class="bar" style="width:8px;height:26px"></div><div class="lb">8</div></div>
<div style="text-align:center"><div class="bar" style="width:12px;height:32px"></div><div class="lb">12</div></div>
<div style="text-align:center"><div class="bar" style="width:16px;height:38px"></div><div class="lb">16</div></div>
<div style="text-align:center"><div class="bar" style="width:24px;height:46px"></div><div class="lb">24</div></div>
<div style="text-align:center"><div class="bar" style="width:32px;height:54px"></div><div class="lb">32</div></div>
<div style="text-align:center"><div class="bar" style="width:48px;height:62px"></div><div class="lb">48</div></div>
<div style="text-align:center"><div class="bar" style="width:72px;height:70px"></div><div class="lb">72</div></div>
<div style="text-align:center"><div class="bar" style="width:112px;height:78px"></div><div class="lb">112</div></div>
</div>
<div style="display:flex;gap:var(--space-6);flex-wrap:wrap;padding-top:var(--space-4);border-top:var(--border-w-hair) solid var(--border-hair)">
<span class="lb">--pad-panel <span style="color:var(--text-body)">24px</span> · card interior</span>
<span class="lb">--control-h <span style="color:var(--text-body)">44px</span> · pill height</span>
<span class="lb">--row-h <span style="color:var(--text-body)">60px</span> · list row</span>
<span class="lb">data-density="compact" tightens all four for tables</span>
</div></div>
</body></html>
