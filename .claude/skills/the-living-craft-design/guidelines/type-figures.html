<!-- @dsCard group="Type" viewport="700x170" name="Mono, figures and sigils" subtitle="Tabular figures for IDs, runs and money; five fixed provenance sigils" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 18px}.lb{font-family:var(--font-mono);font-size:11px;line-height:1.35;color:var(--text-quiet);letter-spacing:0}.vl{font-family:var(--font-mono);font-size:11px;color:var(--text-quiet)}</style></head>
<body><div style="display:grid;gap:12px;font-family:var(--font-mono)">
<div style="display:flex;gap:26px;font-size:var(--size-3);font-variant-numeric:tabular-nums"><span>₹1,20,000</span><span>PR-4821</span><span>run 118</span><span>04:12 IST</span><span>0123456789</span></div>
<div style="display:flex;gap:26px;font-size:var(--size-5);color:var(--text-loud)"><span>[M]</span><span>[H]</span><span>[~]</span><span>[×]</span><span>[†]</span></div>
<div class="vl">Sigils are fixed and never redrawn as icons — they survive print, plain text, and a colour-blind reader.</div></div></body></html>
