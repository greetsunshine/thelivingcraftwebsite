# Runs the retriever agent on a schedule and opens a PR with what it found.
#
# A PR rather than a direct commit on purpose: this agent's output is read
# verbatim by the visitor-facing Q&A agent, so a human should see what it
# gathered before prospects do. The diff is small and the review is quick.

name: Gather latest

on:
  schedule:
    # 06:00 UTC Mondays — 11:30 IST, so the diff is waiting at the start of the week.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional single topic to sweep instead of the defaults'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run the retriever agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # The script has a 6h cooldown so a rapid re-run can't drain the account
        # (that is what took the live agent down on 2026-08-15). The weekly
        # schedule is 7 days apart and never trips it. A manual "Run workflow"
        # click is a deliberate human decision, so that path overrides it —
        # otherwise the button would silently do nothing after a recent run.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.topic }}" ]; then
              npm run gather -- --force "${{ inputs.topic }}"
            else
              npm run gather -- --force
            fi
          else
            npm run gather
          fi

      # Best-effort. Repos with "Allow GitHub Actions to create and approve pull
      # requests" turned off fail this step with a permissions error — but the
      # branch is still pushed, so the work survives. The next step turns that
      # into a one-click compare link rather than a red X and a lost run.
      - name: Open a PR if anything changed
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Retriever: refresh latest.json'
          branch: agent/latest-refresh
          delete-branch: true
          title: 'Retriever: refresh what the site agent knows'
          body: |
            The retriever agent swept its topics and rewrote `src/data/latest.json`.

            Review before merging — the visitor Q&A agent reads these items
            verbatim and will repeat them to prospects.

            Check that each item: is real, is cited with a working URL, says
            nothing about our own pricing or dates, and is worth a prospect's
            attention.
          add-paths: src/data/latest.json

      - name: Say where the branch is if the PR could not be opened
        if: steps.pr.outcome == 'failure'
        run: |
          echo "### Retriever ran, PR not opened" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Actions is not permitted to create pull requests in this repo," >> "$GITHUB_STEP_SUMMARY"
          echo "so the findings were pushed to a branch instead. Open the PR here:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<${{ github.server_url }}/${{ github.repository }}/compare/main...agent/latest-refresh?expand=1>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To let the workflow open it directly: Settings -> Actions -> General ->" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow permissions -> tick 'Allow GitHub Actions to create and approve pull requests'." >> "$GITHUB_STEP_SUMMARY"
