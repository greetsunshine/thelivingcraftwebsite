# Runs the radar agent. Findings go straight into the radar_findings table.
#
# Sibling of gather-latest.yml, which still opens a PR — that one's output is
# repeated verbatim to prospects by a chatbot, so every change to it should be a
# reviewable diff. This one is Sunil's private notebook: nothing public reads
# it, and requiring a merge and a deploy before he could read his own agent's
# findings bought nothing. Review still happens in the console — findings arrive
# as 'new', and the reviewNote on each is where the agent says how far it would
# trust itself — it just no longer needs a deployment.
#
# The console's "Run now" button dispatches this workflow rather than doing the
# research in a Vercel function: a sweep is minutes of Opus web-search calls,
# far past a function's timeout.

name: Gather radar

on:
  schedule:
    # 06:30 UTC Mondays — half an hour after the visitor retriever, so the two
    # never contend for the same rate limit or credit balance.
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      category:
        description: 'Sweep one category only (trends, investment, working, failing, hiring-india, skills)'
        required: false
        type: string

# Read-only. The sweep writes to Postgres now, not to this repository, so the
# job has no reason to be able to push a branch or open a pull request.
permissions:
  contents: read

# Never two radar sweeps at once. Each is six web-searching Opus calls against a
# shared credit balance, and an overlapping run is how the live site agent went
# down before.
concurrency:
  group: gather-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run the radar agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The service-role key bypasses RLS, which is how the sweep writes at
          # all — every radar table has RLS on with no policies attached.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        # The script has a 6h cooldown so a rapid re-run cannot drain the
        # account. The weekly schedule never trips it. A manual dispatch is a
        # deliberate human decision, so that path overrides it — otherwise the
        # console's "Run now" button would silently do nothing after a recent run.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.category }}" ]; then
              npm run radar -- --force "--category=${{ inputs.category }}"
            else
              npm run radar -- --force
            fi
          else
            npm run radar
          fi
