<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Start with the job</title><desc id="desc">An expense assistant should help resolve a request. “Use an agent” does not explain the job.</desc><rect width="1080" height="1350" fill="#111619"/><g font-family="Arial, sans-serif"><text x="90" y="105" fill="#c0c7c7" font-size="25" letter-spacing="3">THE LIVING CRAFT</text><rect x="90" y="143" width="74" height="8" fill="#ff8a4b"/><text x="90" y="260" font-size="64" font-weight="700" fill="#f7f5ed">Start with the job</text><text x="94" y="403" font-size="39" fill="#e5e7e5">An expense assistant should help</text><text x="94" y="461" font-size="39" fill="#e5e7e5">resolve a request. “Use an agent”</text><text x="94" y="519" font-size="39" fill="#e5e7e5">does not explain the job.</text><text x="90" y="1292" fill="#b4bdbc" font-size="22">Design agentic systems. Guide your team.</text><text x="960" y="1292" text-anchor="end" fill="#b4bdbc" font-size="24">01/06</text></g></svg>