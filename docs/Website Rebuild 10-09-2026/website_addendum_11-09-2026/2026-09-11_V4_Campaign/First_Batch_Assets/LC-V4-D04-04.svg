<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Bound the action</title><desc id="desc">Preparing a recommendation and authorising a payment carry different responsibilities. Define each permission.</desc><rect width="1080" height="1350" fill="#111619"/><g font-family="Arial, sans-serif"><text x="90" y="105" fill="#c0c7c7" font-size="25" letter-spacing="3">THE LIVING CRAFT</text><rect x="90" y="143" width="74" height="8" fill="#ff8a4b"/><text x="90" y="260" font-size="64" font-weight="700" fill="#f7f5ed">Bound the action</text><text x="94" y="403" font-size="39" fill="#e5e7e5">Preparing a recommendation and</text><text x="94" y="461" font-size="39" fill="#e5e7e5">authorising a payment carry</text><text x="94" y="519" font-size="39" fill="#e5e7e5">different responsibilities.</text><text x="94" y="577" font-size="39" fill="#e5e7e5">Define each permission.</text><text x="90" y="1292" fill="#b4bdbc" font-size="22">Design agentic systems. Guide your team.</text><text x="960" y="1292" text-anchor="end" fill="#b4bdbc" font-size="24">04/06</text></g></svg>