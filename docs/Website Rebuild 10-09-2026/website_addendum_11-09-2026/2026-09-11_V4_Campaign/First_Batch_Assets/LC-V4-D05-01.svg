<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Choose for the job</title><desc id="desc">A planner, checker and writer can have different needs. Start by naming the decision each one owns.</desc><rect width="1080" height="1350" fill="#111619"/><g font-family="Arial, sans-serif"><text x="90" y="105" fill="#c0c7c7" font-size="25" letter-spacing="3">THE LIVING CRAFT</text><rect x="90" y="143" width="74" height="8" fill="#ff8a4b"/><text x="90" y="260" font-size="64" font-weight="700" fill="#f7f5ed">Choose for the job</text><text x="94" y="403" font-size="39" fill="#e5e7e5">A planner, checker and writer can</text><text x="94" y="461" font-size="39" fill="#e5e7e5">have different needs. Start by</text><text x="94" y="519" font-size="39" fill="#e5e7e5">naming the decision each one</text><text x="94" y="577" font-size="39" fill="#e5e7e5">owns.</text><text x="90" y="1292" fill="#b4bdbc" font-size="22">Sunil Mathew</text><text x="960" y="1292" text-anchor="end" fill="#b4bdbc" font-size="24">01/06</text></g></svg>