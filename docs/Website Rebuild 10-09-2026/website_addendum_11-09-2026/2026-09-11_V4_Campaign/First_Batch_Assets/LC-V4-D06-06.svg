<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Say what would change your mind</title><desc id="desc">A decision is easier to review when the next piece of evidence is explicit. What would you test next?</desc><rect width="1080" height="1350" fill="#111619"/><g font-family="Arial, sans-serif"><text x="90" y="105" fill="#c0c7c7" font-size="25" letter-spacing="3">THE LIVING CRAFT</text><rect x="90" y="143" width="74" height="8" fill="#ff8a4b"/><text x="90" y="260" font-size="64" font-weight="700" fill="#f7f5ed">Say what would change</text><text x="90" y="339" font-size="64" font-weight="700" fill="#f7f5ed">your mind</text><text x="94" y="482" font-size="39" fill="#e5e7e5">A decision is easier to review</text><text x="94" y="540" font-size="39" fill="#e5e7e5">when the next piece of evidence</text><text x="94" y="598" font-size="39" fill="#e5e7e5">is explicit. What would you test</text><text x="94" y="656" font-size="39" fill="#e5e7e5">next?</text><rect x="90" y="1163" rx="12" width="590" height="84" fill="#f6dd36"/><text x="125" y="1218" font-size="34" font-weight="700" fill="#111619">Review your design</text><text x="90" y="1292" fill="#b4bdbc" font-size="22">Design agentic systems. Guide your team.</text><text x="960" y="1292" text-anchor="end" fill="#b4bdbc" font-size="24">06/06</text></g></svg>