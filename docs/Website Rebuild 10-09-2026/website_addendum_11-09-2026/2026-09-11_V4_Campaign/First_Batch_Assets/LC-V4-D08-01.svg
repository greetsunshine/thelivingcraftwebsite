<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">A review starts with behaviour</title><desc id="desc">Illustrative example: the checker rejects an output and the agent tries again. The same rejection repeats.</desc><rect width="1080" height="1350" fill="#111619"/><g font-family="Arial, sans-serif"><text x="90" y="105" fill="#c0c7c7" font-size="25" letter-spacing="3">THE LIVING CRAFT</text><rect x="90" y="143" width="74" height="8" fill="#ff8a4b"/><text x="90" y="260" font-size="64" font-weight="700" fill="#f7f5ed">A review starts with</text><text x="90" y="339" font-size="64" font-weight="700" fill="#f7f5ed">behaviour</text><text x="94" y="482" font-size="39" fill="#e5e7e5">Illustrative example: the checker</text><text x="94" y="540" font-size="39" fill="#e5e7e5">rejects an output and the agent</text><text x="94" y="598" font-size="39" fill="#e5e7e5">tries again. The same rejection</text><text x="94" y="656" font-size="39" fill="#e5e7e5">repeats.</text><text x="90" y="1292" fill="#b4bdbc" font-size="22">Design agentic systems. Guide your team.</text><text x="960" y="1292" text-anchor="end" fill="#b4bdbc" font-size="24">01/06</text></g></svg>