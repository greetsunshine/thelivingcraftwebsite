<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Run the difficult case again</title><desc id="desc">Does it stop correctly? Can a reviewer understand the failure? What uncertainty remains?</desc><rect width="1080" height="1350" fill="#111619"/><g font-family="Arial, sans-serif"><text x="90" y="105" fill="#c0c7c7" font-size="25" letter-spacing="3">THE LIVING CRAFT</text><rect x="90" y="143" width="74" height="8" fill="#ff8a4b"/><text x="90" y="260" font-size="64" font-weight="700" fill="#f7f5ed">Run the difficult case</text><text x="90" y="339" font-size="64" font-weight="700" fill="#f7f5ed">again</text><text x="94" y="482" font-size="39" fill="#e5e7e5">Does it stop correctly? Can a</text><text x="94" y="540" font-size="39" fill="#e5e7e5">reviewer understand the failure?</text><text x="94" y="598" font-size="39" fill="#e5e7e5">What uncertainty remains?</text><text x="90" y="1292" fill="#b4bdbc" font-size="22">Design agentic systems. Guide your team.</text><text x="960" y="1292" text-anchor="end" fill="#b4bdbc" font-size="24">05/06</text></g></svg>