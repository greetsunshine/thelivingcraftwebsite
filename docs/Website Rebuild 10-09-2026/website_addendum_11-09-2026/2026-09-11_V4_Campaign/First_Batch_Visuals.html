<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>First-batch visual drafts</title><style>*{box-sizing:border-box}body{margin:0;color:#172128;background:#f7f6f2;font:17px/1.62 Arial,sans-serif}main{max-width:1140px;margin:auto;padding:40px 32px 80px}h1{font-size:42px;line-height:1.1;letter-spacing:-1.2px;max-width:850px}h2{font-size:27px;line-height:1.25;margin-top:38px}h3{font-size:20px;line-height:1.3}p,li{max-width:82ch;overflow-wrap:anywhere}a{color:#095577;overflow-wrap:anywhere}a:focus-visible{outline:3px solid #c85411;outline-offset:4px}nav{display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid #ccc;padding-bottom:18px;font-size:15px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;margin:22px 0}td,th{padding:12px;border:1px solid #ccc;vertical-align:top;overflow-wrap:anywhere}th{background:#e4e8e8;text-align:left}tr:nth-child(even){background:#fafafa}.post{border-top:2px solid #333;padding-top:15px;margin-top:42px}.tag{display:inline-block;padding:5px 10px;background:#ede1d3;font-size:13px;letter-spacing:.5px}.meta{color:#52606b;font-size:14px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{display:block;padding:24px;background:white;border:1px solid #d7d9d8;border-radius:10px;text-decoration:none;color:#172128}.card h2{font-size:24px;margin:0 0 12px}.card p{margin:0}.hero{background:#111619;color:#faf8ef;padding:36px;border-radius:12px;margin:28px 0}.hero a{color:#f5dc38}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.gallery img{width:100%;height:auto;display:block}.gallery figure{margin:0}.gallery figcaption{font-size:13px;padding:8px 0}.panelcopy{background:#fff;padding:14px 20px;margin:14px 0;border-left:3px solid #8f5131}.panelcopy h3{margin:0 0 10px}.panelcopy p{margin:0}.callout{border-left:4px solid #b25724;padding:12px 20px;background:#fff}code{overflow-wrap:anywhere}.scroll-table{overflow:auto}@media(max-width:700px){main{padding:24px 16px 48px}h1{font-size:32px}.hero{padding:24px}.cards{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}table{font-size:12px}th,td{padding:6px}}@page{size:A4;margin:16mm 15mm 17mm}@media print{body{font-size:10.5pt;background:#fff;line-height:1.45}main{max-width:none;padding:0}nav,.noprint{display:none}h1{font-size:25pt;letter-spacing:0}h2{font-size:17pt}h3{font-size:12pt}h1,h2,h3{break-after:avoid}p{orphans:3;widows:3}table{font-size:9pt}tr,.panelcopy,.card{break-inside:avoid}.post{break-before:page;margin-top:0;padding-top:0;border:0}.post:first-child{break-before:auto}.panelcopy{padding:8px 12px;margin:8px 0}a{color:inherit}.cards{display:block}.card{margin:12px 0}.hero{background:#fff;color:#111;padding:0}.hero a{color:#111}}</style></head><body><main><nav aria-label="Package"><a href="index.html">V4 package</a><a href="Strategy.html">Strategy</a><a href="Copy_Bank.html">32 posts</a><a href="First_Batch_Visuals.html">First-batch visuals</a><a href="Ein_Addendum.html">Ein</a></nav><h1>First-batch visual drafts</h1><p>25 editable panels for D02/D04/D05/D06/D08. Complete copy preceded design. These are illustrative review assets. D01 is written; D03/D07 await Sunil footage.</p><div class="gallery"><figure><a href="First_Batch_Assets/LC-V4-D02-01.svg"><img src="First_Batch_Assets/LC-V4-D02-01.svg" alt="Design agentic systems. Guide your team.. Build a working system. Explain your decisions. Develop your reasoning through continuous feedback.  30 live hours plus independent work.  Explore the open cohort."></a><figcaption>LC-V4-D02 · Panel 1 · <a href="First_Batch_Assets/LC-V4-D02-01.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D04-01.svg"><img src="First_Batch_Assets/LC-V4-D04-01.svg" alt="Start with the job. An expense assistant should help resolve a request. “Use an agent” does not explain the job."></a><figcaption>LC-V4-D04 · Panel 1 · <a href="First_Batch_Assets/LC-V4-D04-01.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D04-02.svg"><img src="First_Batch_Assets/LC-V4-D04-02.svg" alt="Separate the fixed rules. A spending limit can be checked in code. A model does not need to reinterpret it on every run."></a><figcaption>LC-V4-D04 · Panel 2 · <a href="First_Batch_Assets/LC-V4-D04-02.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D04-03.svg"><img src="First_Batch_Assets/LC-V4-D04-03.svg" alt="Find the uncertain decision. An unclear description may need interpretation or another question. Name what information would resolve it."></a><figcaption>LC-V4-D04 · Panel 3 · <a href="First_Batch_Assets/LC-V4-D04-03.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D04-04.svg"><img src="First_Batch_Assets/LC-V4-D04-04.svg" alt="Bound the action. Preparing a recommendation and authorising a payment carry different responsibilities. Define each permission."></a><figcaption>LC-V4-D04 · Panel 4 · <a href="First_Batch_Assets/LC-V4-D04-04.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D04-05.svg"><img src="First_Batch_Assets/LC-V4-D04-05.svg" alt="Decide how to check it. Use cases with known outcomes, review ambiguous cases and test what happens when evidence is missing."></a><figcaption>LC-V4-D04 · Panel 5 · <a href="First_Batch_Assets/LC-V4-D04-05.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D04-06.svg"><img src="First_Batch_Assets/LC-V4-D04-06.svg" alt="Review your own workflow. Which steps need interpretation? Which need tools? Which can stay deterministic?  Illustrative teaching example."></a><figcaption>LC-V4-D04 · Panel 6 · <a href="First_Batch_Assets/LC-V4-D04-06.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D05-01.svg"><img src="First_Batch_Assets/LC-V4-D05-01.svg" alt="Choose for the job. A planner, checker and writer can have different needs. Start by naming the decision each one owns."></a><figcaption>LC-V4-D05 · Panel 1 · <a href="First_Batch_Assets/LC-V4-D05-01.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D05-02.svg"><img src="First_Batch_Assets/LC-V4-D05-02.svg" alt="Define acceptable behaviour. What must this role get right? Which failure would make the output unusable?"></a><figcaption>LC-V4-D05 · Panel 2 · <a href="First_Batch_Assets/LC-V4-D05-02.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D05-03.svg"><img src="First_Batch_Assets/LC-V4-D05-03.svg" alt="Compare on your cases. Use representative inputs and the same acceptance criteria. Include difficult and incomplete cases."></a><figcaption>LC-V4-D05 · Panel 3 · <a href="First_Batch_Assets/LC-V4-D05-03.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D05-04.svg"><img src="First_Batch_Assets/LC-V4-D05-04.svg" alt="Count the surrounding cost. Include retries, review time and failed work alongside model charges. A cheaper call can cost more overall."></a><figcaption>LC-V4-D05 · Panel 4 · <a href="First_Batch_Assets/LC-V4-D05-04.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D05-05.svg"><img src="First_Batch_Assets/LC-V4-D05-05.svg" alt="Test the checker too. A second model can share mistakes. Compare its judgments with known cases and qualified human review."></a><figcaption>LC-V4-D05 · Panel 5 · <a href="First_Batch_Assets/LC-V4-D05-05.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D05-06.svg"><img src="First_Batch_Assets/LC-V4-D05-06.svg" alt="Make the choice revisitable. Record the reason, the limitation and the evidence that would trigger a new comparison.  Illustrative model-selection review."></a><figcaption>LC-V4-D05 · Panel 6 · <a href="First_Batch_Assets/LC-V4-D05-06.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D06-01.svg"><img src="First_Batch_Assets/LC-V4-D06-01.svg" alt="Compare a decision. Illustrative case: choose a model for drafting a service plan that must respect fixed constraints."></a><figcaption>LC-V4-D06 · Panel 1 · <a href="First_Batch_Assets/LC-V4-D06-01.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D06-02.svg"><img src="First_Batch_Assets/LC-V4-D06-02.svg" alt="Start with the constraint. One candidate writes clearly but misses a required condition. Decide whether that failure is acceptable before looking at price."></a><figcaption>LC-V4-D06 · Panel 2 · <a href="First_Batch_Assets/LC-V4-D06-02.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D06-03.svg"><img src="First_Batch_Assets/LC-V4-D06-03.svg" alt="Inspect the whole system. Can a deterministic check detect the omission? What happens after it is detected? Include the cost of that recovery."></a><figcaption>LC-V4-D06 · Panel 3 · <a href="First_Batch_Assets/LC-V4-D06-03.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D06-04.svg"><img src="First_Batch_Assets/LC-V4-D06-04.svg" alt="Compare like with like. Use the same representative cases and criteria. Record latency, successful work, failures and review effort."></a><figcaption>LC-V4-D06 · Panel 4 · <a href="First_Batch_Assets/LC-V4-D06-04.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D06-05.svg"><img src="First_Batch_Assets/LC-V4-D06-05.svg" alt="Explain the trade-off. “It is cheaper” leaves out the consequence. Explain what improves, what becomes harder and what remains uncertain."></a><figcaption>LC-V4-D06 · Panel 5 · <a href="First_Batch_Assets/LC-V4-D06-05.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D06-06.svg"><img src="First_Batch_Assets/LC-V4-D06-06.svg" alt="Say what would change your mind. A decision is easier to review when the next piece of evidence is explicit. What would you test next?"></a><figcaption>LC-V4-D06 · Panel 6 · <a href="First_Batch_Assets/LC-V4-D06-06.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D08-01.svg"><img src="First_Batch_Assets/LC-V4-D08-01.svg" alt="A review starts with behaviour. Illustrative example: the checker rejects an output and the agent tries again. The same rejection repeats."></a><figcaption>LC-V4-D08 · Panel 1 · <a href="First_Batch_Assets/LC-V4-D08-01.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D08-02.svg"><img src="First_Batch_Assets/LC-V4-D08-02.svg" alt="Ask the next question. What new evidence or valid option does the next attempt have? If nothing changes, why would it succeed?"></a><figcaption>LC-V4-D08 · Panel 2 · <a href="First_Batch_Assets/LC-V4-D08-02.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D08-03.svg"><img src="First_Batch_Assets/LC-V4-D08-03.svg" alt="Locate the decision. The checker identifies the failure. The workflow needs an explicit decision about recovery, stopping or human review."></a><figcaption>LC-V4-D08 · Panel 3 · <a href="First_Batch_Assets/LC-V4-D08-03.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D08-04.svg"><img src="First_Batch_Assets/LC-V4-D08-04.svg" alt="Make a change you can test. Bound the attempts. Define the unresolved outcome. Record enough evidence to explain why the workflow stopped."></a><figcaption>LC-V4-D08 · Panel 4 · <a href="First_Batch_Assets/LC-V4-D08-04.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D08-05.svg"><img src="First_Batch_Assets/LC-V4-D08-05.svg" alt="Run the difficult case again. Does it stop correctly? Can a reviewer understand the failure? What uncertainty remains?"></a><figcaption>LC-V4-D08 · Panel 5 · <a href="First_Batch_Assets/LC-V4-D08-05.png">PNG</a></figcaption></figure><figure><a href="First_Batch_Assets/LC-V4-D08-06.svg"><img src="First_Batch_Assets/LC-V4-D08-06.svg" alt="Practise the reasoning. Build, explain, examine and revise through continuous feedback.  Design agentic systems. Guide your team. learning.thelivingcraft.ai"></a><figcaption>LC-V4-D08 · Panel 6 · <a href="First_Batch_Assets/LC-V4-D08-06.png">PNG</a></figcaption></figure></div><h2>Carousel PDFs</h2><p><a href="First_Batch_Assets/LC-V4-D04.pdf">LC-V4-D04</a> · <a href="First_Batch_Assets/LC-V4-D05.pdf">LC-V4-D05</a> · <a href="First_Batch_Assets/LC-V4-D06.pdf">LC-V4-D06</a> · <a href="First_Batch_Assets/LC-V4-D08.pdf">LC-V4-D08</a></p></main></body></html>
